<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Числовой ввод</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
        }

        main {
            width: min(320px, 90vw);
        }

        #value {
            width: 100%;
            margin-bottom: 12px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 28px;
            text-align: right;
            background: white;
        }

        #keyboard {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        #keyboard.visible {
            display: grid;
        }

        button {
            height: 58px;
            border: 0;
            border-radius: 10px;
            background: white;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 1px 3px #0002;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(.97);
            background: #eee;
        }

    </style>
</head>

<body>

<main>
    <label for="value">число</label><input
        id="value"
        type="number"
        inputmode="decimal"
        autocomplete="off"
>

    <div id="keyboard">
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="0">0</button>
        <button data-key=",">,</button>

        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button data-action="plus">+</button>
        <button data-action="backspace">x</button>

        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button data-action="minus">−</button>
        <button class="done" data-action="done">OK</button>
    </div>
</main>

<script>
    const input = document.querySelector('#value');
    const keyboard = document.querySelector('#keyboard');

    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches && window.matchMedia('(hover: none)').matches;

    if (isTouchDevice) {
        input.setAttribute('type', 'text');

        input.addEventListener('focus', () => {
            keyboard.classList.add('visible');
        });

        input.addEventListener('blur', () => {
            keyboard.classList.remove('visible');
        });

        const addKey = (key) => {
            if (key === ',' && input.value.includes(',')) return;

            if (input.value === '0' && key !== ',') {
                input.value = key;
            } else {
                input.value += key;
            }
        }

        const getValue = () => parseFloat(input.value.replace(',', '.')) || 0;
        const setValue = (value) => input.value = value.toString().replace('.', ',');

        keyboard.addEventListener('pointerdown', (e) => {
            const button = e.target.closest('button');
            if (!button) return;

            e.preventDefault();

            const key = button.dataset.key;
            const action = button.dataset.action;

            if (key !== undefined) {
                addKey(key);
            } else if (action === 'backspace') {
                input.value = input.value.slice(0, -1);
            } else if (action === 'plus') {
                setValue(getValue() + 1);
            } else if (action === 'minus') {
                setValue(getValue() - 1);
            } else if (action === 'done') {
                input.blur();
            }

            input.dispatchEvent(new Event('input', {
                bubbles: true
            }));
        });

        input.addEventListener('blur', () => {
            keyboard.classList.remove('visible');
        });
    }


</script>

</body>
</html>
