<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Моё приложение</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* Кнопка обратной связи */
        .open {
            width: 52px;
            height: 52px;

            border: 0;
            border-radius: 50%;

            background: #222;
            color: white;

            font-size: 22px;
            cursor: pointer;

            box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
            transition: transform .15s ease, background .15s ease;
        }

        .open:hover {
            transform: scale(1.05);
            background: #333;
        }

        .open:active {
            transform: scale(.95);
        }

        /* Затемнение */
        #overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;
            background: rgba(0, 0, 0, .35);
        }

        #overlay.opened {
            display: flex;
        }

        /* Окно */
        .tip {
            position: relative;

            width: min(100%, 400px);

            padding: 24px;

            border-radius: 18px;
            background: white;

            box-shadow: 0 16px 50px rgba(0, 0, 0, .2);
        }

        .tip h2 {
            margin: 0 0 20px;
            font-size: 21px;
        }

        /* Закрыть */
        .close {
            position: absolute;
            top: 12px;
            right: 12px;

            width: 32px;
            height: 32px;

            border: 0;
            border-radius: 50%;

            background: transparent;
            color: #777;

            font-size: 22px;
            line-height: 1;

            cursor: pointer;
        }

        .close:hover {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

<main>
    <h1>Моё приложение
        <button id="open-tip" class="open">&#9432;</button>
    </h1>
</main>

<div class="overlay" id="overlay">
    <div class="tip">
        <button id="close-tip" class="close" aria-label="Закрыть">×</button>
        <div>Подсказка</div>
    </div>
</div>


<script>
    const openTipButton = document.getElementById('open-tip');
    const closeTipButton = document.getElementById('close-tip');
    const overlay = document.getElementById('overlay');

    // Открыть
    openTipButton.addEventListener('click', () => overlay.classList.add('opened'));

    // Закрыть
    const close = () => overlay.classList.remove('opened');

    closeTipButton.addEventListener('click', close);

    // Закрытие по клику на фон
    overlay.addEventListener('click', (event) => {
        if (event.target === overlay) close();
    });

    // Закрытие по Escape
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') close();
    });
</script>

</body>
</html>
