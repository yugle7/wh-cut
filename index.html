<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <title>Раскрой</title>
    <link rel="canonical" href="https://yugle7.github.io/wh-cut/"/>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
<article id="main">
    <div id="hello">
        <a href="https://www.tbank.ru/cf/3sEawgoGUDe" target="_blank" id="say-thank">
            Сказать спасибо
        </a>
        <button id="change-theme" class="right">
            <svg class="menu hidden yellow">
                <use href="sprite.svg#sun"></use>
            </svg>
            <svg class="menu hidden blue">
                <use href="sprite.svg#moon"></use>
            </svg>
        </button>
    </div>

    <div class="content">
        <button id="create-task">Создать раскрой</button>
        <ol id="tasks"></ol>
    </div>

</article>

<article id="to-remove-task" class="hidden">
    <div>Вы действительно</div>
    <div>хотите удалить задание?</div>
    <div class="big"></div>
    <span class="row">
        <button id="yes-remove-task" class="eye">Да</button>
        <button id="no-remove-task" class="eye">Нет</button>
    </span>
</article>

<article id="setting" class="hidden">
    <div>
        <label for="task-title" class="hidden">Название задачи</label>
        <input type="text" class="big" id="task-title" placeholder="Название задачи"/>
    </div>
    <div id="update-task">

    </div>
    <div id="task" class="hidden">
        <form tabindex="0">
            <div>
                <label for="task-start">Начало</label>
                <input type="date" id="task-start" tabindex="1"/>
            </div>
            <div>
                <label for="task-finish">Завершение</label>
                <input type="date" id="task-finish" tabindex="2"/>
            </div>
            <div>
                <label for="task-kerf">Ширина реза</label>
                <input type="number" inputmode="numeric" id="task-kerf" placeholder="мм" tabindex="3"/>
            </div>
            <label for="task-material" class="hidden">Материал листа</label>
            <input type="text" id="task-material" placeholder="Материал листа" tabindex="4"/>
            <button type="button" id="save-task" class="create" onclick="toSave()">Сохранить</button>
        </form>
    </div>
    <br>

    <button id="add-sheet"><span class="big">Лист</span></button>
    <button id="update-sheet"></button>
    <div id="sheet" class="hidden">
        <form>
            <section>
                <label for="sheet-width">Длина</label>
                <label for="sheet-rotated"></label>
                <label for="sheet-height">Высота</label>
                <span></span>
                <label for="sheet-edge">Отступ</label>
                <span></span>
                <label for="sheet-depth">Толщина</label>

                <input type="number" inputmode="numeric" id="sheet-width" placeholder="мм"
                       autocomplete="off" tabindex="1"/>
                <button type="button" id="sheet-rotated" tabindex="2"></button>
                <input type="number" inputmode="numeric" id="sheet-height" placeholder="мм"
                       autocomplete="off" tabindex="3"/>
                <svg>
                    <use href="sprite.svg#v"></use>
                </svg>
                <input type="number" inputmode="numeric" id="sheet-edge" placeholder="мм"
                       autocomplete="off" tabindex="4"/>
                <span></span>
                <input type="number" inputmode="numeric" id="sheet-depth" placeholder="мм"
                       autocomplete="off" tabindex="5"/>
            </section>
            <button type="button" id="save-sheet" class="create" onclick="toSave()">Сохранить</button>
        </form>
    </div>

    <br>
    <button id="add-scrap" class="head">
        <span class="big">Обрезки</span>
        <svg class="yellow">
            <use href="sprite.svg#plus"></use>
        </svg>
    </button>
    <ol id="scraps"></ol>
    <button id="create-scrap" class="create">Добавить</button>

    <br>
    <button id="add-edging" class="head">
        <span class="big">Кромки</span>
        <svg class="yellow">
            <use href="sprite.svg#plus"></use>
        </svg>
    </button>
    <ol id="edgings"></ol>
    <button id="create-edging" class="create">Добавить</button>
    <br>

    <button id="add-roll" class="head">
        <span class="big">Рулоны</span>
        <svg class="yellow">
            <use href="sprite.svg#plus"></use>
        </svg>
    </button>
    <ol id="rolls"></ol>
    <button id="create-roll" class="create">Добавить</button>
    <br>

    <button id="add-piece" class="head">
        <span class="big">Детали</span>
        <svg class="yellow">
            <use href="sprite.svg#plus"></use>
        </svg>
    </button>
    <ol id="pieces"></ol>
    <button id="create-piece" class="create">Добавить</button>
    <br>

    <button id="remove-task" class="eye">
        Удалить задание
    </button>

    <nav>
        <button id="to-main">
            <svg class="green">
                <use href="sprite.svg#left"></use>
            </svg>
        </button>
        <button id="to-cutting">
            <svg class="yellow">
                <use href="sprite.svg#cutting"></use>
            </svg>
        </button>
        <label for="to-cutting" class="right">
            <svg class="gray">
                <use href="sprite.svg#right"></use>
            </svg>
        </label>
    </nav>


    <div class="hidden">
        <div id="scrap">
            <form>
                <section>
                    <label for="scrap-width">Длина</label>
                    <span></span>
                    <label for="scrap-height">Высота</label>
                    <span></span>
                    <label for="scrap-edge">Отступ</label>
                    <span></span>
                    <label for="scrap-count">Кол-во</label>

                    <input type="number" inputmode="numeric" id="scrap-width" placeholder="мм"
                           autocomplete="off" tabindex="1"/>
                    <svg class="icon">
                        <use href="sprite.svg#x"></use>
                    </svg>
                    <input type="number" inputmode="numeric" id="scrap-height" placeholder="мм"
                           autocomplete="off" tabindex="2"/>
                    <svg class="icon">
                        <use href="sprite.svg#v"></use>
                    </svg>
                    <input type="number" inputmode="numeric" id="scrap-edge" placeholder="мм"
                           autocomplete="off" tabindex="3"/>
                    <span></span>
                    <input type="number" inputmode="numeric" id="scrap-count" placeholder="шт"
                           autocomplete="off" tabindex="4"/>

                </section>
                <button type="button" id="delete-scrap" class="delete" onclick="toDelete(event)">Очистить</button>
            </form>
        </div>

        <div id="edging">
            <form>
                <section>
                    <label for="edging-line">Линия</label>
                    <span></span>
                    <label for="edging-thick">Толщина</label>

                    <button id="edging-line" tabindex="1"></button>
                    <span></span>
                    <input type="number" inputmode="numeric" step="0.1" id="edging-thick" placeholder="мм"
                           autocomplete="off" tabindex="2"/>
                </section>
                <label for="edging-text" class="hidden">Описание</label>
                <textarea id="edging-text" placeholder="Описание" tabindex="2"></textarea>
                <button type="button" id="delete-edging" class="delete" onclick="toDelete(event)">Очистить</button>
            </form>

        </div>

        <div id="roll">
            <form>
                <section>
                    <label for="roll-edging">Кромка</label>
                    <label>Диаметр</label>
                    <label>внутри и снаружи</label>
                    <label for="roll-inner" class="hidden">Внутри</label>
                    <label for="roll-outer" class="hidden">Снаружи</label>
                    <span></span>

                    <button id="roll-edging" tabindex="1"></button>
                    <svg class="icon">
                        <use href="sprite.svg#v"></use>
                    </svg>
                    <div>
                        <input type="number" inputmode="numeric" step="0.1" id="roll-inner" placeholder="мм"
                               autocomplete="off" tabindex="2"/>
                        <span class="pad">-</span>
                        <input type="number" inputmode="numeric" step="0.1" id="roll-outer" placeholder="мм"
                               autocomplete="off" tabindex="3"/>
                        <span></span>
                    </div>
                </section>
                <button type="button" id="delete-roll" class="delete" onclick="toDelete(event)">Очистить</button>
            </form>
        </div>

        <div id="piece">
            <form>
                <section>
                    <label for="piece-width">Длина</label>
                    <label for="piece-rotated">Пов-от</label>
                    <label for="piece-height">Высота</label>
                    <span></span>
                    <label for="piece-extra">Доп.об.</label>
                    <label for="piece-count">Кол-во</label>

                    <input type="number" inputmode="numeric" id="piece-width" placeholder="мм" autocomplete="off"
                           tabindex="1"/>
                    <button type="button" id="piece-rotated" tabindex="2"></button>
                    <input type="number" inputmode="numeric" id="piece-height" placeholder="мм" autocomplete="off"
                           tabindex="3"/>
                    <span></span>
                    <button type="button" id="piece-extra" tabindex="4"></button>
                    <input type="number" inputmode="numeric" id="piece-count" placeholder="шт" autocomplete="off"
                           tabindex="5"/>

                    <button id="piece-edging-up" tabindex="6"></button>
                    <span></span>
                    <button id="piece-edging-left" tabindex="8"></button>
                    <span></span>
                    <span></span>
                    <span></span>

                    <button id="piece-edging-down" tabindex="7"></button>
                    <span></span>
                    <button id="piece-edging-right" tabindex="9"></button>
                    <span></span>
                    <span></span>
                    <span></span>
                </section>
                <label for="piece-text" class="hidden">Описание</label>
                <textarea id="piece-text" placeholder="Описание" tabindex="10"></textarea>
                <button type="button" id="delete-piece" class="delete" onclick="toDelete(event)">Очистить</button>
            </form>
        </div>
    </div>
</article>


<article id="cutting" class="hidden">
    <div id="drop"></div>
    <div id="gutter"></div>
    <div class="wrapper">
        <div id="take"></div>
    </div>

    <nav>
        <button id="to-setting">
            <svg class="yellow">
                <use href="sprite.svg#left"></use>
            </svg>
        </button>
        <button id="download-cutting">
            <svg class="green">
                <use href="sprite.svg#download"></use>
            </svg>
        </button>
        <label for="download-cutting" class="hidden"></label>
        <button id="rotate-piece" class="right">
            <svg>
                <use href="sprite.svg#rotate"></use>
            </svg>
        </button>
        <button id="cut-direction">
            <svg>
                <use href="sprite.svg#direction"></use>
            </svg>
        </button>

        <button id="cut">
            <svg>
                <use href="sprite.svg#cut"></use>
            </svg>
        </button>
        <button id="clear">
            <svg>
                <use href="sprite.svg#clear"></use>
            </svg>
        </button>
    </nav>
    <button id="do-cut" class="eye hidden">
        Улучшить раскрой
    </button>
</article>

<div id="print"></div>

<script>
    if (navigator.serviceWorker) {
        navigator.serviceWorker.register(
            '/wh-cut/sw.js',
            {scope: '/wh-cut/'}
        )
    }
</script>

<script src="tasks.js"></script>
<script src="script.js"></script>

</body>
</html>
