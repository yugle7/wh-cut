<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <title>Раскрой</title>
    <link rel="canonical" href="https://yugle7.github.io/wh-cut/"/>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
<article id="main">
    <div id="hello">
        <a href="https://www.tbank.ru/cf/3sEawgoGUDe" target="_blank" id="say-thank">
            Сказать спасибо
        </a>
        <button id="change-theme">
            <svg class="menu hidden yellow">
                <use href="sprite.svg#sun"></use>
            </svg>
            <svg class="menu hidden blue">
                <use href="sprite.svg#moon"></use>
            </svg>
        </button>
    </div>

    <div class="content">
        <button id="create-task">Создать раскрой</button>
        <ol id="tasks"></ol>
    </div>

</article>

<article id="to-remove-task" class="hidden">
    <div>Вы действительно</div>
    <div>хотите удалить задание?</div>
    <h1></h1>
    <div>
        <button id="yes-remove-task" class="eye">Да</button>
        <button id="no-remove-task" class="eye">Нет</button>
    </div>
</article>

<article id="setting" class="hidden">
    <div id="to-update-task"></div>
    <button class="out" id="to-update-sheet"></button>

    <br>
    <button class="out" id="to-create-scrap">
        <span class="big pad">Обрезки</span>
        <svg class="yellow">
            <use href="sprite.svg#plus"></use>
        </svg>
    </button>
    <ol id="scraps"></ol>

    <br>
    <button class="out" id="to-create-edging">
        <span class="big pad">Кромки</span>
        <svg class="yellow">
            <use href="sprite.svg#plus"></use>
        </svg>
    </button>
    <ol id="edgings"></ol>

    <br>
    <button class="out" id="to-create-roll">
        <span class="big pad">Рулоны</span>
        <svg class="yellow">
            <use href="sprite.svg#plus"></use>
        </svg>
    </button>
    <ol id="rolls"></ol>

    <br>
    <button id="to-create-piece" class="out">
        <span class="big pad">Детали</span>
        <svg class="yellow">
            <use href="sprite.svg#plus"></use>
        </svg>
    </button>
    <ol id="pieces"></ol>
    <button id="create-piece" class="out pad">
        <label>Длина</label>
        <svg>
            <use href="sprite.svg#x"></use>
        </svg>
        <label>Высота</label>
        <span></span>
        <label>Кол-во</label>
    </button>

    <br>
    <button id="remove-task" class="eye">
        Удалить задание
    </button>

    <nav>
        <button id="to-main">
            <svg class="green">
                <use href="sprite.svg#left"></use>
            </svg>
        </button>
        <button id="to-cutting">
            <svg class="yellow">
                <use href="sprite.svg#cutting"></use>
            </svg>
        </button>
    </nav>


    <div id="input" class="hidden">
        <form id="task" class="hidden">
            <section class="out">
                <label for="task-title" class="hidden">Название задачи</label>
                <input type="text" id="task-title" placeholder="Название задачи"/>
            </section>
            <section class="out">
                <label for="task-start">Дата</label>
                <input type="date" id="task-start"/>
            </section>
            <section class="out">
                <label for="task-finish">Срок</label>
                <input type="date" id="task-finish"/>
            </section>
            <section class="out">
                <label for="task-material" class="hidden">Материал листа</label>
                <input type="text" id="task-material" placeholder="Материал листа"/>
            </section>
            <section class="out">
                <label for="task-thick">Толщина листа</label>
                <input type="number" inputmode="numeric" id="task-thick" placeholder="мм"/>
            </section>
        </form>

        <form id="sheet" class="hidden">
            <section class="out">
                <span>Размеры листа</span>
                <div class="center">
                    <label>
                        <input type="number" inputmode="numeric" id="sheet-width" placeholder="длина"
                               autocomplete="off"/>
                    </label>
                    <svg class="icon">
                        <use href="sprite.svg#x"></use>
                    </svg>
                    <label>
                        <input type="number" inputmode="numeric" id="sheet-height" placeholder="ширина"
                               autocomplete="off"/>
                    </label>
                </div>
            </section>
            <section class="out">
                <label for="sheet-edge">Отступ от края</label>
                <input type="number" inputmode="numeric" id="sheet-edge" placeholder="мм" autocomplete="off"/>
            </section>
            <section class="out">
                <label for="task-kerf">Ширина реза</label>
                <input type="number" inputmode="numeric" id="task-kerf" placeholder="мм"/>
            </section>
        </form>

        <form id="scrap" class="hidden">
            <section class="out">
                <span>Размеры</span>
                <div>
                    <label>
                        <input type="number" inputmode="numeric" id="scrap-width" placeholder="длина"
                               autocomplete="off"/>
                    </label>
                    <svg class="icon">
                        <use href="sprite.svg#x"></use>
                    </svg>
                    <label>
                        <input type="number" inputmode="numeric" id="scrap-height" placeholder="ширина"
                               autocomplete="off"/>
                    </label>
                </div>
            </section>
            <section class="out">
                <label for="scrap-edge">Отступ от края</label>
                <input type="number" inputmode="numeric" id="scrap-edge" placeholder="мм" autocomplete="off"/>
            </section>
            <section class="out">
                <label for="scrap-count">Количество</label>
                <input type="number" inputmode="numeric" id="scrap-count" placeholder="шт" autocomplete="off"/>
            </section>
        </form>

        <form id="edging" class="hidden">
            <section class="out">
                <label for="edging-line">Линия</label>
                <button id="edging-line"></button>
            </section>
            <section class="out">
                <label for="edging-thick">Толщина</label>
                <input type="number" inputmode="numeric" step="0.1" id="edging-thick" placeholder="мм"
                       autocomplete="off"/>
            </section>
            <section class="out">
                <label for="edging-text" class="hidden">Кромка</label>
                <input type="text" id="edging-text" placeholder="Кромка"/>
            </section>
        </form>

        <form id="roll" class="hidden">
            <section class="out">
                <label for="roll-edging">Кромка</label>
                <button id="roll-edging"></button>
            </section>
            <section class="out">
                <label for="roll-inner">Внутренний диаметр</label>
                <input type="number" inputmode="numeric" step="0.1" id="roll-inner" placeholder="мм"
                       autocomplete="off"/>
            </section>
            <section class="out">
                <label for="roll-outer">Внешний диаметр</label>
                <input type="number" inputmode="numeric" step="0.1" id="roll-outer" placeholder="мм"
                       autocomplete="off"/>
            </section>
        </form>
    </div>
    <div class="hidden">
        <div id="piece">
            <form>
                <section id="piece-head">
                    <label for="piece-width">Длина</label>
                    <label for="piece-rotated">Пов-от</label>
                    <label for="piece-height">Высота</label>
                    <button type="button" onclick="toSave(event)" class="full"></button>
                    <label for="piece-extra">Доп.об.</label>
                    <label for="piece-count">Кол-во</label>

                    <div class="col">
                        <input type="number" inputmode="numeric" id="piece-width" placeholder="мм"
                               autocomplete="off"/>
                    </div>
                    <button type="button" id="piece-rotated"></button>
                    <div class="col">
                        <input type="number" inputmode="numeric" id="piece-height" placeholder="мм"
                               autocomplete="off"/>
                    </div>
                    <button type="button" onclick="toSave()" class="full"></button>
                    <button type="button" id="piece-extra"></button>
                    <input type="number" inputmode="numeric" id="piece-count" placeholder="шт" autocomplete="off"/>
                </section>

                <section id="piece-foot">
                    <div class="col">
                        <span id="piece-edging-up"></span>
                        <span id="piece-edging-down"></span>
                    </div>
                    <button type="button" onclick="toSave()" class="full"></button>
                    <div class="col">
                        <span id="piece-edging-left"></span>
                        <span id="piece-edging-right"></span>
                    </div>
                    <span></span>
                    <div>
                        <label for="piece-text" class="hidden">Описание</label>
                        <textarea id="piece-text" placeholder="Описание"></textarea>
                    </div>
                </section>
                <button type="button" id="delete-piece" onclick="toDelete(event)">Очистить</button>
            </form>
        </div>
    </div>
</article>


<article id="cutting" class="hidden">
    <div id="drop"></div>
    <div id="gutter"></div>
    <div class="wrapper">
        <div id="take"></div>
    </div>

    <nav>
        <button id="to-setting">
            <svg class="yellow">
                <use href="sprite.svg#left"></use>
            </svg>
        </button>
        <button id="download-cutting">
            <svg class="green">
                <use href="sprite.svg#download"></use>
            </svg>
        </button>
        <button id="rotate-piece">
            <svg>
                <use href="sprite.svg#rotate"></use>
            </svg>
        </button>
        <button id="cut-direction">
            <svg>
                <use href="sprite.svg#direction"></use>
            </svg>
        </button>

        <button id="cut">
            <svg>
                <use href="sprite.svg#cut"></use>
            </svg>
        </button>
        <button id="clear">
            <svg>
                <use href="sprite.svg#clear"></use>
            </svg>
        </button>
    </nav>
    <button id="do-cut" class="eye hidden">
        Улучшить раскрой
    </button>
</article>

<div id="print"></div>

<script>
    if (navigator.serviceWorker) {
        navigator.serviceWorker.register(
            '/wh-cut/sw.js',
            {scope: '/wh-cut/'}
        )
    }
</script>

<script src="tasks.js"></script>
<script src="script.js"></script>

</body>
</html>
